name: TheRoom
options:
  bundleIdPrefix: com.man
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer Team ID before building
    CODE_SIGN_STYLE: Automatic

targets:
  TheRoom:
    type: application
    platform: iOS
    sources:
      - path: TheRoom
        excludes:
          - "**/*.md"
    resources:
      - path: TheRoom/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.man.TheRoom
        PRODUCT_NAME: TheRoom
        TARGETED_DEVICE_FAMILY: "1"
        ASSETSCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: TheRoom/Info.plist
      properties:
        NSUserNotificationsUsageDescription: "The Room sends a gentle daily reminder to check in with yourself."
        NSLocalNetworkUsageDescription: "The Room uses your local network to let nearby friends breathe together with you."
        NSBonjourServices:
          - "_theroom-breathe._tcp"
          - "_theroom-breathe._udp"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: NO
        UIBackgroundModes: []
    entitlements:
      path: TheRoom/TheRoom.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.man.theroom
    dependencies:
      - target: TheRoomWidgetExtension
      - sdk: CoreHaptics.framework
      - sdk: MultipeerConnectivity.framework
      - sdk: FoundationModels.framework
    scheme:
      testTargets:
        - TheRoomTests
      gatherCoverageData: true

  TheRoomWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TheRoomWidget
      # Shared with the app target so the widget can read/write the same
      # App-Group-backed SwiftData store and reuse pure logic + theme.
      - path: TheRoom/Models
        group: Shared/Models
      - path: TheRoom/DesignSystem/Theme.swift
        group: Shared/DesignSystem
      - path: TheRoom/Services/AppModelContainer.swift
        group: Shared/Services
      - path: TheRoom/Services/StreakCalculator.swift
        group: Shared/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.man.TheRoom.TheRoomWidget
        PRODUCT_NAME: TheRoomWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "The Room"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: TheRoomWidget/TheRoomWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.man.theroom

  TheRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TheRoomTests
    dependencies:
      - target: TheRoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.man.TheRoom.Tests
        GENERATE_INFOPLIST_FILE: YES
